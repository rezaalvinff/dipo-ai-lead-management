name: Backend tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dipo
          POSTGRES_PASSWORD: dipo
          POSTGRES_DB: dipo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dipo -d dipo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dipo:dipo@localhost:5432/dipo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: pip install -e ".[dev]"
      - name: Run lint
        run: ruff check .
      - name: Run automated tests
        run: pytest -q
